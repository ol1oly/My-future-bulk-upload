<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>myFuture Toolkit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true"><img src="assets/martlet-128.png" alt="" /></div>
        <div>
          <h1>myFuture Toolkit</h1>
          <p id="status" role="status">Reading this page…</p>
        </div>
      </header>

      <button id="smartSearch" type="button" class="smart-search" hidden>Smart search all postings</button>
      <section id="jobPanel" class="job-panel" hidden aria-live="polite"></section>
      <section id="empty" class="empty" hidden></section>

      <section id="postingsPanel" class="apps-panel" hidden>
        <div class="apps-head">
          <strong>My postings <span id="postingsCount" class="count"></span></strong>
          <span><span id="postingsSynced"></span>
            <button id="findMatches" type="button" class="secondary small" title="Reads every Internship / Co-op posting (~40 s) and suggests the best matches">Find matches</button>
            <button id="syncButton" type="button" class="secondary small" title="Read your myFuture shortlist, applications, CVs and packages">Sync</button></span>
        </div>
        <p class="apps-intro">Your shortlist and applications. You always submit in myFuture.</p>
        <div id="postingsFilters" class="filters"></div>
        <p id="postingsNote" class="apps-note"></p>
        <button id="applyAll" type="button" class="apply-all">Apply to all with a package (0)</button>
        <p id="postingsProgress" class="apps-progress" aria-live="polite"></p>
        <div id="postingsList" class="apps-list"></div>
      </section>

      <section id="claudePanel" class="apps-panel claude" hidden>
        <strong>From Claude</strong>
        <p id="claudeStatus" class="apps-intro"></p>
        <button id="claudeRun" type="button" class="secondary">Upload letters &amp; build packages</button>
      </section>
    </main>
    <script src="lib/jobs.js"></script>
    <script src="popup-jobs.js"></script>
    <script src="popup-postings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
